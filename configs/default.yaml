# ReBike default configuration

data:
  region: JC              # JC = Jersey City/Hoboken (small files); NYC = Manhattan/Brooklyn/... (~1 GB/month)
  train_months: ["202406", "202407", "202408", "202409"]
  test_months: ["202410"]           # held out: agent is evaluated on unseen days
  n_stations: 60
  weekdays_only: true
  raw_dir: data/raw
  dock_capacity: data/dock_capacity.json   # cached GBFS dock counts
  out_train: data/processed/demand_train.npz
  out_test: data/processed/demand_test.npz

env:
  model_path: data/processed/demand_train.npz
  start_hour: 6
  end_hour: 22
  tick_min: 5
  truck_capacity: 20
  truck_speed_kmh: 18.0
  handling_min: 3.0
  transfer_levels: [-10, -5, -2, 0, 2, 5, 10]
  init_mode: warm
  fleet_fill: 0.4
  overnight_rebalance: 0.3
  demand_noise_sigma: 0.15
  # reward = w_served*served - w_lost*lost - w_km*km - w_dock*failed_docks
  w_served: 0.0
  w_lost: 1.0
  w_km: 0.2
  w_dock: 0.25
  demand_scale: 1.0
  extra_features: true      # truck travel time + projected fill observations

ppo:
  total_timesteps: 2000000
  n_envs: 8
  n_steps: 256
  batch_size: 512
  n_epochs: 10
  learning_rate: 0.0003
  lr_final_frac: 0.1       # linear decay to 10% of the initial LR
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  net_arch: [256, 256]
  seed: 0
  eval_freq: 100000        # validation on training-demand days -> <name>_best.zip
  eval_episodes: 10
  val_seed: 7000
  model_dir: models
  log_dir: results/tb

threshold_tuning:
  episodes: 10
  seed: 5000
  low: [0.1, 0.15, 0.2, 0.25, 0.3]
  high: [0.7, 0.75, 0.8, 0.85, 0.9]
  target: [0.4, 0.5, 0.6]
  out: results/threshold_tuned.json

eval:
  model_path: data/processed/demand_test.npz
  episodes: 30
  seed: 1000
  out_dir: results
